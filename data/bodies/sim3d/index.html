<!DOCTYPE html><html><head><meta charset="utf-8"><title>jeremy field — 3D</title>
<style>
 html,body{margin:0;height:100%;background:#06070c;overflow:hidden;font:12px/1.45 ui-monospace,Menlo,monospace;color:#aeb6c6}
 #hud{position:fixed;left:12px;top:10px;z-index:5;background:rgba(8,10,18,.66);padding:9px 12px;border-radius:7px;max-width:360px}
 #hud b{color:#e8edf7} #stat{position:fixed;right:12px;top:10px;z-index:5;background:rgba(8,10,18,.66);padding:8px 11px;border-radius:7px;font-variant-numeric:tabular-nums}
 #load{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);color:#ff9a4a}
 canvas{display:block}
</style>
<script src="https://unpkg.com/three@0.128.0/build/three.min.js"></script>
<script src="https://unpkg.com/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head><body>
<div id="hud"><b>jeremy field · 3D</b> — billboards from the footage, driven by the<br>
same field. footage-drift is the only motion; the field rotates + weights paths.<br>
<b>mouse</b> orbit · <b>space</b> pause · <b>r</b> reset<br>
<b>v</b> circulate · <b>d</b> reverse · <b>m</b> model (force/pursuit) · <b>[ ]</b> ring R · <b>- =</b> dancers</div>
<div id="stat"></div>
<div id="load">loading footage…</div>
<script>
let P={R:4.0, band:1.5, SCALE:8.0, turn:2.2, circulate:0, N:5, space:3.0, dir:1, lead:0.42, mode:'force', repK:2.5, circK:2.2, fpar:3.0, anchor:1.5};
let DATA,FR,NODES,PAL,nw,nh,fps,PH,PW, dancers=[], paused=false;
const modpi=a=>{a%=Math.PI;return a<0?a+Math.PI:a;};
const dpi=(to,from)=>{let d=(to-from)%Math.PI;if(d>Math.PI/2)d-=Math.PI;if(d<-Math.PI/2)d+=Math.PI;return d;};
function b64u8(s){const b=atob(s),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u;}
const cxAt=fc=>{const i=Math.max(0,Math.min(FR.length-1,fc)),i0=Math.floor(i),i1=Math.min(FR.length-1,i0+1);return FR[i0].cx+(FR[i1].cx-FR[i0].cx)*(i-i0);};

// ---------- THREE scene ----------
const R3=new THREE.WebGLRenderer({antialias:true});R3.setPixelRatio(devicePixelRatio);R3.setSize(innerWidth,innerHeight);R3.outputEncoding=THREE.sRGBEncoding;document.body.appendChild(R3.domElement);
const scene=new THREE.Scene();scene.background=new THREE.Color(0x06070c);scene.fog=new THREE.Fog(0x06070c,18,48);
const cam=new THREE.PerspectiveCamera(50,innerWidth/innerHeight,0.1,300);cam.position.set(0,6,15);
const ctrls=new THREE.OrbitControls(cam,R3.domElement);ctrls.target.set(0,1.5,0);ctrls.maxPolarAngle=Math.PI*0.49;ctrls.minDistance=5;ctrls.maxDistance=40;
scene.add(new THREE.AmbientLight(0x3a4256,1.0));
const fireLight=new THREE.PointLight(0xff7a26,2.2,40,2);fireLight.position.set(0,1.2,0);scene.add(fireLight);
const floor=new THREE.Mesh(new THREE.PlaneGeometry(60,60),new THREE.MeshStandardMaterial({color:0x0c0e15,roughness:1,metalness:0}));
floor.rotation.x=-Math.PI/2;scene.add(floor);
let ring=null; function makeRing(){ if(ring)scene.remove(ring); ring=new THREE.Mesh(new THREE.RingGeometry(P.R-0.03,P.R+0.03,80),new THREE.MeshBasicMaterial({color:0x2a3450,side:THREE.DoubleSide}));ring.rotation.x=-Math.PI/2;ring.position.y=0.02;scene.add(ring);}
// fire
const fireMat=new THREE.MeshBasicMaterial({color:0xffb24a});
const fire=new THREE.Mesh(new THREE.ConeGeometry(0.35,1.3,12),fireMat);fire.position.y=0.65;scene.add(fire);
const glowTex=(()=>{const c=document.createElement('canvas');c.width=c.height=64;const g=c.getContext('2d').createRadialGradient(32,32,2,32,32,32);g.addColorStop(0,'rgba(255,180,80,.9)');g.addColorStop(.4,'rgba(255,120,30,.5)');g.addColorStop(1,'rgba(255,90,20,0)');const x=c.getContext('2d');x.fillStyle=g;x.fillRect(0,0,64,64);const t=new THREE.CanvasTexture(c);return t;})();
const glow=new THREE.Sprite(new THREE.SpriteMaterial({map:glowTex,transparent:true,depthWrite:false,blending:THREE.AdditiveBlending}));glow.scale.set(3,3,1);glow.position.y=0.9;scene.add(glow);

// ---------- dancers ----------
function makeDancer(){
 const cv=document.createElement('canvas');cv.width=nw;cv.height=nh;const ctx=cv.getContext('2d');const img=ctx.createImageData(nw,nh);
 const tex=new THREE.CanvasTexture(cv);tex.minFilter=THREE.LinearFilter;tex.magFilter=THREE.NearestFilter;tex.generateMipmaps=false;
 const mat=new THREE.MeshBasicMaterial({map:tex,transparent:true,alphaTest:0.5,side:THREE.DoubleSide});
 const mesh=new THREE.Mesh(new THREE.PlaneGeometry(PW,PH),mat);mesh.position.y=PH/2;
 const grp=new THREE.Group();grp.add(mesh);scene.add(grp);
 const sh=new THREE.Mesh(new THREE.CircleGeometry(0.6,18),new THREE.MeshBasicMaterial({color:0,transparent:true,opacity:.3}));sh.rotation.x=-Math.PI/2;sh.position.y=0.015;grp.add(sh);
 return {cv,ctx,img,tex,grp,mesh};
}
function paint(d){
 const node=NODES[d.n], gf=node.ord+Math.floor(d.fc), f=FR[Math.min(FR.length-1,gf)];
 if(!f._m){f._m=b64u8(f.mask);f._i=b64u8(f.idx);}
 const data=d.img.data; data.fill(0); const off=Math.round(nw/2 - f.cx*nw); let oi=0;
 for(let r=0;r<f.h;r++)for(let c=0;c<f.w;c++){ if(f._m[r*f.w+c]){ const col=PAL[f._i[oi++]]; const X=f.x+c+off, Y=f.y+r;
   if(X>=0&&X<nw&&Y>=0&&Y<nh){ const px=(Y*nw+X)*4; data[px]=col[0];data[px+1]=col[1];data[px+2]=col[2];data[px+3]=255; } } }
 d.ctx.putImageData(d.img,0,0); d.tex.needsUpdate=true;
}
function reset(){
 for(const d of dancers) scene.remove(d.grp);
 dancers=[]; for(let i=0;i<P.N;i++){const a=Math.random()*6.283,r=9+Math.random()*2;const o=makeDancer();
   dancers.push(Object.assign(o,{x:Math.cos(a)*r,y:Math.sin(a)*r,th:Math.random()*Math.PI,n:(Math.random()*NODES.length)|0,fc:0,sign:1}));}
}

// ---------- the field (ported from the 2D sim) ----------
function fieldForce(d){
 const r=Math.hypot(d.x,d.y)||1e-6, rx=d.x/r, ry=d.y/r;
 let fx=-(r-P.R)*rx, fy=-(r-P.R)*ry;
 for(const o of dancers){if(o===d)continue;const ex=d.x-o.x,ey=d.y-o.y,dd=ex*ex+ey*ey;if(dd<16){const m=P.repK/Math.max(0.4,dd);fx+=ex*m;fy+=ey*m;}}
 if(P.circulate){fx+=-ry*P.circK*P.dir;fy+=rx*P.circK*P.dir;}
 return {x:fx,y:fy};
}
function heading(d){
 const phi=Math.atan2(d.y,d.x),dist=Math.hypot(d.x,d.y)||1e-6;
 let near=Math.PI;for(const o of dancers){if(o===d)continue;let dd=Math.atan2(o.y,o.x)-phi;dd=Math.atan2(Math.sin(dd),Math.cos(dd));if(Math.abs(dd)<Math.abs(near))near=dd;}
 const ideal=2*Math.PI/Math.max(1,dancers.length);
 const spread=-Math.sign(near||1)*0.3*Math.max(0,1-Math.abs(near)/ideal);
 const ahead=(P.circulate?P.lead*P.dir:0)+spread; d._s=Math.min(1,Math.abs(dist-P.R)/P.band);
 return Math.atan2(P.R*Math.sin(phi+ahead)-d.y, P.R*Math.cos(phi+ahead)-d.x);
}
function pickEdge(d){
 const node=NODES[d.n]; if(!node.edges.length)return;
 const need=d._need!=null?d._need:0.5, fts=Math.sign(d._ft||0)||1, fm=Math.min(1,Math.abs(d._ft||0)), STEER=2.0;
 const sc=node.edges.map(e=>{const m=NODES[e.dst];
   const net=FR[Math.min(FR.length-1,m.ord+m.len-1)].cx-FR[m.ord].cx;   // this clip's real footage direction (signed)
   const align=(net>=0?1:-1)*fts*fm;                                    // F‖: favour clips whose footage goes the force's way — opposing still possible
   const beh=need*m.travel+(1-need)*m.Epix/(1+6*m.travel);
   return {e,w:0.02+beh*Math.exp(STEER*align)};});
 let t=sc.reduce((a,c)=>a+c.w,0)||1,rr=Math.random()*t,p=sc[sc.length-1];
 for(const c of sc){rr-=c.w;if(rr<=0){p=c;break;}} d.n=p.e.dst; d.fc=0;
}
function step(dt){
 for(const d of dancers){
   let hx,hy,tgt,F,hv;
   if(P.mode==='force'){
     F=fieldForce(d); const Fmag=Math.hypot(F.x,F.y);
     const tangent=modpi(Math.atan2(d.y,d.x)+Math.PI/2), follow=Math.min(1,Fmag/P.anchor);
     tgt=modpi(tangent+follow*dpi(modpi(Math.atan2(F.y,F.x)),tangent));
   } else { hv=heading(d); tgt=modpi(hv); }
   // DAMPED rotation: low-pass the turn rate so a torque that flip-flops ±90° at the
   // mod-π perpendicular ambiguity averages to ~0 — she holds steady instead of buzzing.
   d.w=(d.w||0)*0.82 + dpi(tgt,d.th)*0.18;
   d.th=modpi(d.th+Math.max(-P.turn*dt,Math.min(P.turn*dt,d.w)));
   hx=Math.cos(d.th); hy=Math.sin(d.th);
   if(P.mode==='force'){ d._ft=F.x*hx+F.y*hy; d._need=Math.min(1,Math.abs(d._ft)/P.fpar); }
   else { d._ft=(Math.cos(hv)*hx+Math.sin(hv)*hy)*1.5; d._need=P.circulate?1:(d._s>0.3?1:0); }
   const node=NODES[d.n], ord=node.ord, len=node.len, gf0=ord+Math.min(len-1,d.fc);
   d.fc+=dt*fps; const gf1=ord+Math.min(len-1,d.fc), dcx=cxAt(gf1)-cxAt(gf0);
   const disp=dcx*P.SCALE;   // RAW footage — never reversed, never flipped; the field only steered via rotation + weights
   d.x+=disp*hx; d.y+=disp*hy; d._sp=Math.abs(disp)/Math.max(1e-4,dt);
   if(d.fc>=len-1) pickEdge(d);
 }
}
let prev=performance.now(), tt=0;
function loop(){ requestAnimationFrame(loop);
 const now=performance.now(); let dt=Math.min(.05,(now-prev)/1000); prev=now; tt+=dt;
 if(!paused){ for(let k=0;k<2;k++) step(dt/2); }
 for(const d of dancers){ d.grp.position.set(d.x,0,d.y); d.grp.rotation.y=-d.th; paint(d); }
 fire.scale.y=1+0.12*Math.sin(tt*9)+0.06*Math.sin(tt*23); fireLight.intensity=2.0+0.5*Math.sin(tt*11);
 glow.scale.setScalar(2.7+0.25*Math.sin(tt*7));
 ctrls.update(); R3.render(scene,cam);
 document.getElementById('stat').innerHTML=`model <b>${P.mode}</b> · N ${dancers.length} · R ${P.R.toFixed(1)} · ${P.circulate?'circulate '+(P.dir>0?'↺':'↻'):'settle'}${paused?' · PAUSED':''}`;
}
addEventListener('keydown',e=>{const k=e.key;
 if(k===' '){paused=!paused;e.preventDefault();} if(k==='r')reset();
 if(k==='v')P.circulate=P.circulate?0:1; if(k==='d')P.dir=-P.dir; if(k==='m')P.mode=P.mode==='force'?'pursuit':'force';
 if(k==='['){P.R=Math.max(1.5,P.R-0.5);makeRing();} if(k===']'){P.R+=0.5;makeRing();}
 if(k==='-'){P.N=Math.max(1,P.N-1);reset();} if(k==='='||k==='+'){P.N++;reset();}});
addEventListener('resize',()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();R3.setSize(innerWidth,innerHeight);});

fetch('jeremy3d.json?v='+Date.now()).then(r=>r.json()).then(j=>{
 DATA=j;FR=j.frames;NODES=j.nodes;PAL=j.palette;nw=j.nw;nh=j.nh;fps=j.fps;PH=2.8;PW=PH*nw/nh;
 const ords=NODES.map(n=>n.ord).slice().sort((a,b)=>a-b); const nextOf={}; ords.forEach((o,i)=>nextOf[o]=i+1<ords.length?ords[i+1]:FR.length);
 NODES.forEach(n=>n.len=Math.max(2,nextOf[n.ord]-n.ord));
 makeRing(); reset(); document.getElementById('load').remove(); loop();
});
</script></body></html>
